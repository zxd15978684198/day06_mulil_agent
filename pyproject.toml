[project]
name = "mutil-agent"
version = "0.1.0"
description = "Day06 星桥科技新员工助手（多 Agent）：Supervisor + Agent-as-Tool，带权限过滤的公司制度知识库与设备申请审批闭环"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "pillow>=12.3.0",
    "pymysql>=1.2.3",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
]

# src 布局：可安装代码在 src/personal_assistant/；
# 数据目录（data/ knowledge/ vector_store/）在 src/ 下但在包外（见 docs/Day06_执行计划_v2.md §5.1）。
# 项目名（发行名）仍为 mutil-agent，只有 import 包名是 personal_assistant。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]
