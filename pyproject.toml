[project]
name = "mutil-agent"
version = "0.1.0"
description = "Day06 星桥科技新员工助手（多 Agent）：Supervisor + Agent-as-Tool，带权限过滤的公司制度知识库与设备申请审批闭环"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "openinference-instrumentation-langchain>=0.1.80",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
]

# 开发/门禁工具与运行依赖分开：CI 用 --all-groups 安装，
# 生产环境不会被迫装 pytest/detect-secrets 等工具。
[dependency-groups]
lint = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0,<8.0",
]
security = [
    "detect-secrets>=1.5,<2.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "security" },
]

# src 布局：可安装代码在 src/personal_assistant/；
# 数据目录（data/ knowledge/ vector_store/）在 src/ 下但在包外（见 docs/plans/Day06_执行计划_v2.md §5.1）。
# 项目名（发行名）仍为 mutil-agent，只有 import 包名是 personal_assistant。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]

[tool.ruff]
#说明：按 Python 3.13 的语法和可用特性分析代码。
target-version = "py313"
#说明：Ruff formatter 的目标行宽，也是部分 lint 规则使用的长度。
line-length = 88

[tool.ruff.lint]
#说明：E/F 是常见语法与逻辑问题，I 是导入顺序。
#说明：B 是容易形成缺陷的写法，UP 是现代 Python 写法。
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 旧独立验收脚本 / 部署脚本里有大量中文断言消息和长命令，先只豁免 E501；
# 其他规则仍然生效。新代码不要往这些文件里继续加长行。
"tests/acceptance_day06.py" = ["E501"]
"tests/acceptance_persistence.py" = ["E501"]
"tests/verify_phase4_repro.py" = ["E501"]
"tests/verify_phase5.py" = ["E501"]
"docker/bootstrap_db.py" = ["E501"]
"scripts/validate_version_manifest.py" = ["E501"]

[tool.mypy]
#说明：按项目真正支持的 Python 版本解释类型语法和标准库。
python_version = "3.13"
#说明：为新建的小型项目启用完整的严格检查组合。
strict = true

[[tool.mypy.overrides]]
# 这两个第三方包没有 py.typed/stub；只豁免导入，不关闭全项目检查。
module = [
    "rapidocr_onnxruntime",
    "rapidocr_onnxruntime.*",
    "pypdfium2",
    "pypdfium2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
#说明：没有显式传路径时，只从 tests 目录收集测试。
testpaths = ["tests"]
#说明：显示跳过等测试摘要，并把未注册的 Marker 当成错误。
addopts = "-ra --strict-markers"

[tool.coverage.run]
#说明：除语句是否执行外，还检查 if/else 等分支是否都走到。
branch = true
#说明：只统计两个业务包，不把测试和临时脚本算进分母。
source = ["personal_assistant"]

[tool.coverage.report]
#说明：在终端报告中直接列出没有执行到的行号。
show_missing = true
#说明：总覆盖率低于 90% 时返回失败退出码。
# 补齐业务 Tool、解析/检索、路由和入口单测后实测 72%；
# 目标已达成，先设 70 留一点波动空间，后续再冲 80+。
fail_under = 70
