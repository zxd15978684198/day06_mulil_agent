# Alembic 配置 —— 放在仓库根
# ============================================================================
# 位置说明（本项目按 src 布局，依据见 src/personal_assistant/paths.py:16-20）：
#
#   本文件留在仓库根。alembic 默认在当前工作目录找 alembic.ini，IDE 与外部工具
#   也认这个位置；用 %(here)s（= 本文件所在目录）写路径，从任何目录调用都不会跑偏。
#
#   迁移环境与 SQL 放 src/migrations/ —— 与 src/data/、src/knowledge/、
#   src/vector_store/ 同级，但在**包外**。这样 pyproject.toml:40-41 的
#   `packages = ["src/personal_assistant"]` 不会把迁移和 SQL 打进 wheel。

[alembic]
script_location = %(here)s/src/migrations

# 让 `import personal_assistant` 与 `import migrations.sql_runner` 都能工作。
# （可编辑安装时 personal_assistant 本来就能 import，这一行是不依赖它的保证。）
prepend_sys_path = %(here)s/src

# 连接串**故意留空**：真实值由 src/migrations/env.py 从 .env / 环境变量注入，
# 避免把密码提交进版本库。
sqlalchemy.url =

# 迁移文件名：<日期>_<时间>_<rev>_<slug>.py
# （`%%` 是 configparser 插值里的转义写法，不能写成单个 `%`）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时间戳默认 UTC。想改成本地时区需要装 tzdata（Windows 没有系统级 tz 数据库），
# 装好之后再取消注释，否则 `alembic revision` 会因为找不到时区而报错：
# timezone = Asia/Shanghai

[post_write_hooks]

# ---------------------------------------------------------------------------
# 日志：env.py 会调用 fileConfig()，所以这几节必须存在
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
