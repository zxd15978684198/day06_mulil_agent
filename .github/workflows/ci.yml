name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 单元测试只 import database，不连接 MySQL；dummy 值即可。
      DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:3306/agent_service?charset=utf8mb4
      JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
      OTEL_SDK_DISABLED: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Static type check
        run: uv run --locked mypy src

      - name: Secret check
        run: >-
          git ls-files -z
          | xargs -0 uv run --locked detect-secrets-hook
          --baseline .secrets.baseline

      # 向量索引由 build_index.py 生成、不入库；干净 checkout 里没有
      # src/vector_store/index_manifest.json，跳过 index 相关校验。
      - name: Validate Agent version manifest
        run: >-
          uv run --locked python scripts/validate_version_manifest.py
          --allow-missing-index

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run tests with coverage
        run: >-
          uv run --locked pytest
          --junitxml=reports/pytest.xml
          --cov
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Upload test and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/
            dist/
            release/agent_versions.json
            uv.lock
            .secrets.baseline
